<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101010" />
    <meta
      name="description"
      content="Ritual Frame — Independent Filmmaking by Ferry Kaupisch."
    />
    <title>Ritual Frame — Independent Filmmaking</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card-shell">
      <section class="card" aria-label="Ritual Frame — digitale Visitenkarte">
        <div class="artwork-crop" aria-hidden="true">
          <img
            class="artwork"
            src="assets/ritual-frame-card-reference.png"
            alt=""
          />
        </div>

        <nav class="contact-links" aria-label="Ritual Frame kontaktieren">
          <a
            class="contact-link youtube"
            href="https://www.youtube.com/@RitualFrame"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Ritual Frame auf YouTube öffnen"
          ><span>YouTube</span></a>
          <a
            class="contact-link instagram"
            href="https://www.instagram.com/ritual_frame"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Ritual Frame auf Instagram öffnen"
          ><span>Instagram</span></a>
          <a
            class="contact-link email"
            href="mailto:ritualframe@web.de"
            aria-label="E-Mail an Ritual Frame schreiben"
          ><span>E-Mail</span></a>
        </nav>
      </section>
    </main>
  </body>
</html>
